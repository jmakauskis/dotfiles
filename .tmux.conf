# Keep the existing prefix; press Ctrl+s twice to send it to the application.
unbind C-b
set -g prefix C-s
bind C-s send-prefix
bind r source-file ~/.tmux.conf \; display-message 'tmux config reloaded'

# Default split bindings.
unbind |
unbind -
bind '"' split-window
bind % split-window -h

# Navigate with prefix + Vim keys, or Alt + arrows without a prefix.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Keep sidebars session-scoped, but do not automatically add them to new windows.
bind b run-shell 'workmux sidebar --session; tmux set-hook -gu "after-new-window[99]"'
set-hook -gu 'after-new-window[99]'
bind L run-shell 'workmux last-done'
bind C-s display-popup -h 30 -w 100 -E "workmux dashboard"
bind Tab run-shell 'workmux last-agent'
bind Enter resize-pane -Z
# A repo name selects ~/repo; leave blank to use the current pane's directory.
bind N display-popup -EE -d '#{pane_current_path}' 'bash -c "current=\$PWD; cd \"\$HOME\" || exit 1; read -e -r -p \"Repo name (Tab completes; blank = current): \" repo || exit 0; if [ -n \"\$repo\" ]; then cd \"\$HOME/\$repo\" || exit 1; else cd \"\$current\" || exit 1; fi; read -e -r -p \"Task/window name: \" task || exit 0; [ -n \"\$task\" ] || exit 0; if git rev-parse --show-toplevel >/dev/null 2>&1; then workmux add -- \"\$task\"; else tmux new-window -n \"\$task\" -c \"\$PWD\" pi; fi"'

set -g mouse on
# Forward the outer terminal's identity so TUIs (e.g. Hunk) detect OSC 52 support.
set -g update-environment "DISPLAY SSH_ASKPASS_REQUIRE SSH_AGENT_PID SSH_CONNECTION WINDOWID TERM_PROGRAM TERM_PROGRAM_VERSION COLORTERM TERM_FEATURES"

# Send copy-mode yanks and mouse-drag selections to the macOS clipboard.
set -s copy-command 'pbcopy'
set -s set-clipboard on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
setw -g allow-rename off
setw -g automatic-rename off

# Quiet notifications.
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# Guide's red/yellow theme, using the terminal's own palette.
setw -g clock-mode-colour yellow
setw -g mode-style 'fg=black,bg=red,bold'
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# Use Ghostty's foreground/background; borders indicate pane focus.
set -g window-style 'fg=default,bg=default'
set -g window-active-style 'fg=default,bg=default'

set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red,bg=black'
set -g status-left ''
set -g status-left-length 10
set -g status-right-style 'fg=black,bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
setw -g window-status-current-style 'fg=black,bg=red'
setw -g window-status-current-format ' #I #W#{?@workmux_status, #{@workmux_status},} #F '
setw -g window-status-style 'fg=red,bg=black'
setw -g window-status-format ' #I #[fg=white]#W#{?@workmux_status, #{@workmux_status},} #[fg=yellow]#F '
setw -g window-status-bell-style 'fg=yellow,bg=red,bold'
set -g message-style 'fg=yellow,bg=red,bold'
